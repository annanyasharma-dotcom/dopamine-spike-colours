<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dopamine Colour Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Bebas+Neue&display=swap">
<style>
/* Layout: top bar; library rail left; five proportional colour columns, action row, title block and three stat columns right. */
:root{
  --page:#F2F2F2; --panel:#FFFFFF; --panel-2:#F7F7F7; --field:#F2F2F2; --ink:#0D0D0D; --ink-2:#525252; --ink-3:#808080;
  --line:#DBDBDB; --line-2:#C4C4C4; --btn:#0D0D0D; --btn-ink:#FFFFFF; --sel:#0D0D0D;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#1A1A1A; --panel:#242424; --panel-2:#2B2B2B; --field:#141414; --ink:#F2F2F2; --ink-2:#ADADAD; --ink-3:#808080;
  --line:#3B3B3B; --line-2:#525252; --btn:#FFFFFF; --btn-ink:#0D0D0D; --sel:#F2F2F2; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#1A1A1A; --panel:#242424; --panel-2:#2B2B2B; --field:#141414; --ink:#F2F2F2; --ink-2:#ADADAD; --ink-3:#808080;
  --line:#3B3B3B; --line-2:#525252; --btn:#FFFFFF; --btn-ink:#0D0D0D; --sel:#F2F2F2; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--page)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button{font:inherit;color:inherit}
.app{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* top bar */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:8px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:999px;background:color-mix(in srgb,var(--page) 62%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;box-shadow:0 10px 30px -18px rgba(0,0,0,.45),inset 0 1px 0 color-mix(in srgb,var(--panel) 55%,transparent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--page)}
.segs{margin:10px 16px 12px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:4px;background:var(--field);border-radius:999px}
.seg{all:unset;cursor:pointer;text-align:center;font-size:14px;font-weight:500;padding:8px 6px;border-radius:999px;color:var(--ink-2)}
.seg[aria-selected="true"]{background:var(--btn);color:var(--btn-ink);font-weight:600}
.seg:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.theme{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--panel);width:max-content}
.theme button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.theme button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.theme button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.word{font-size:clamp(18px,2.2vw,26px);font-weight:500;letter-spacing:-.03em;color:var(--ink-2);text-align:center}
.word{display:flex;justify-content:center;align-items:center;min-width:0;grid-column:2}
.theme{grid-column:1;justify-self:start}
.cta{grid-column:3}
.lg{height:clamp(30px,4.2vw,46px);width:auto;max-width:100%;display:block;transform:translateY(2px)}
.lg-white{display:none}
.top .word{border-radius:12px;transition:opacity .2s ease}
.top .word:hover{opacity:.85}
.top .word:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
@media (max-width:560px){.cta{font-size:0;gap:0;padding:10px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-ink{display:none}:root:not([data-theme="light"]) .lg-white{display:block}}
:root[data-theme="dark"] .lg-ink{display:none}:root[data-theme="dark"] .lg-white{display:block}
.cta{all:unset;cursor:pointer;grid-column:3;justify-self:end;background:transparent;color:var(--ink);border:1px solid var(--line-2);font-weight:500;font-size:15px;padding:9px 18px;border-radius:999px;display:flex;gap:6px;align-items:center;white-space:nowrap;transition:background .2s ease,border-color .2s ease}
.cta:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);border-color:var(--ink-3)}
@media (max-width:700px){.cta{padding:0;width:40px;height:40px;justify-content:center;box-sizing:border-box}.cta-t{display:none}}
.cta:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.main{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}

/* library */
.lib{background:var(--panel);border-radius:28px;padding:16px 0 0;display:flex;flex-direction:column;max-height:calc(100vh - 120px);min-height:420px;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
@media (max-width:900px){.lib{position:static;max-height:460px}}
.lib-head{display:flex;justify-content:space-between;align-items:center;padding:0 16px}
.lib-head h2{margin:0;font-size:26px;font-weight:500;letter-spacing:-.03em}
.round{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:700}
.round:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.field{margin:12px 16px 0;display:flex;align-items:center;gap:8px;background:var(--field);border-radius:999px;padding:12px 14px}
.field input{all:unset;flex:1;min-width:0;font-size:15px}
.field input::placeholder{color:var(--ink)}
.kbd{font-size:11px;border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;color:var(--ink-2)}
.manage{all:unset;cursor:pointer;margin:10px 16px 12px;display:flex;justify-content:space-between;align-items:center;background:var(--field);border-radius:999px;padding:0 16px;height:44px;font-size:15px}
.manage:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.manage span{color:var(--ink-3);font-size:13px}
.list{overflow:auto;flex:1;border-top:1px solid var(--line)}
.item{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:12px;padding:14px 20px 14px 20px;border-bottom:1px solid var(--line);border-left:3px solid transparent;width:100%;box-sizing:border-box}
.item[aria-current="true"]{background:var(--panel-2);border-left-color:var(--sel)}
.item:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.row1{display:flex;gap:6px;align-items:stretch}
.bar{flex:1;display:flex;height:32px;border-radius:4px;overflow:hidden;min-width:0}
.bar i{flex:1}
.mx{flex:none;width:60px;border-radius:4px;display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row2 .n{display:flex;align-items:center;gap:10px;min-width:0;font-size:19px;letter-spacing:-.02em}
.row2 .n strong{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipx{font-size:13px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:2px 10px;white-space:nowrap}
.aa{flex:none;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;display:flex;gap:4px;align-items:center}
.aa.ok{background:var(--btn);color:var(--btn-ink)}
.aa.no{border:1px solid var(--line-2);color:var(--ink-3);font-weight:500}

/* stage */
.stage{background:var(--panel);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:20px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;min-width:0}
.cols.many{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.col{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;min-width:0;transition:background .4s ease}
.col .hd{padding:22px 20px 18px;display:flex;flex-direction:column;gap:8px;min-height:104px;justify-content:flex-end}
.col .pc{font-size:clamp(20px,1.9vw,26px);font-weight:600;letter-spacing:-.025em;line-height:1.1;overflow-wrap:anywhere}
.col .nm{font-size:14px;font-weight:500;opacity:.85;overflow-wrap:anywhere}
.col .nm:empty{display:none}
.kv{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 20px;border-top:1px solid var(--div);font-size:14px;line-height:1.3}
.kv:focus-visible{outline:2px solid currentColor;outline-offset:-3px}
.kv:hover{background:var(--hov)}
.kv small{display:block;font-size:14px;opacity:.95}
.kv span{min-width:0;overflow-wrap:anywhere}
.kv svg{flex:none;opacity:.7}
@media (max-width:480px){.cols,.cols.many{grid-template-columns:minmax(0,1fr)}.col .hd{min-height:0}}

.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:9px 18px;font-size:16px;font-weight:500}
.btn.solid{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.actions .sp{flex:1}

.titlebar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
.titlebar h1{margin:0;font-size:clamp(38px,5.4vw,66px);font-weight:600;letter-spacing:-.045em;line-height:1;text-wrap:balance}
.tags{display:flex;gap:6px;margin-top:22px;flex-wrap:wrap}
.tags span{background:var(--panel-2);border-radius:10px;padding:6px 14px;font-size:17px;font-weight:500}
.desc{margin:22px 0 0;font-size:18px;line-height:1.6;max-width:58ch;color:var(--ink)}
.orb{width:clamp(130px,17vw,240px);aspect-ratio:1.5;max-width:100%;border-radius:16px;filter:saturate(1.1);box-shadow:inset 0 0 40px rgba(0,0,0,.25)}
@media (max-width:600px){.titlebar{grid-template-columns:minmax(0,1fr)}.orb{display:none}}

.matrix{overflow-x:auto}
.matrix table{border-collapse:separate;border-spacing:4px;font-size:13px;font-variant-numeric:tabular-nums}
.matrix td,.matrix th{width:84px;height:54px;border-radius:8px;text-align:center;font-weight:600}
.matrix th{font-weight:500;color:var(--ink-3);height:auto}
.matrix td small{display:block;font-size:10px;font-weight:600;letter-spacing:.04em;opacity:.8}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 64px;border-top:1px solid var(--line);padding-top:32px}
.stats>div{max-width:400px}
@media (max-width:760px){.stats{grid-template-columns:minmax(0,1fr);gap:24px}}
.stats h3{margin:0 0 14px;font-size:18px;font-weight:500}
.stats dl{margin:0}
.stats .r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:17px}
.stats .r:last-child{border-bottom:1px solid var(--line)}
.pp{display:flex;align-items:center;gap:10px}
.pill{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:500}
.pill[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.pill:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sec{padding:14px 20px 6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line)}
.stats dt{color:var(--ink-3)}.stats dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--btn);color:var(--btn-ink);font-size:14px;font-weight:600;padding:9px 16px;border-radius:999px;transition:.25s;pointer-events:none;z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- landing ---------- */
:root:not([data-view="gallery"]) .main{display:none}
[data-view="gallery"] .landing{display:none}
.landing{display:flex;flex-direction:column;justify-content:space-between;gap:clamp(16px,3vh,32px);min-height:calc(100dvh - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-block:clamp(12px,3vh,36px) 0;transition:opacity .32s ease,transform .32s ease;overflow-x:clip}
.landing.leaving{opacity:0;transform:scale(1.02) translateY(-8px)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;flex:1}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.copy{display:flex;flex-direction:column;gap:0;min-width:0}
.headline{margin:0;font-family:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;font-weight:400;font-size:clamp(56px,min(8.4vw,15vh),150px);line-height:.88;letter-spacing:-.005em;text-transform:uppercase;text-wrap:balance;cursor:default}
.headline .w{display:inline-block;white-space:nowrap}
.headline .ch{display:inline-block;transition:color 1.1s ease,transform .25s cubic-bezier(.2,.9,.3,1.4)}
.headline .ch.hot{transition:color .08s linear,transform .2s cubic-bezier(.2,.9,.3,1.6);transform:translateY(-.04em)}
.byline{margin-top:clamp(12px,2.2vh,22px);font-size:16px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
.byline b{color:var(--ink);font-weight:600}
.byline i{width:14px;height:2px;border-radius:2px;background:var(--ink)}
.lede{margin:clamp(12px,2.4vh,24px) 0 0;font-size:clamp(16px,min(1.5vw,2.3vh),19px);line-height:1.55;max-width:44ch;color:var(--ink-2)}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:clamp(16px,3vh,30px)}
.btn.big{font-size:17px;padding:13px 24px;font-weight:600}
.btn.big svg{transition:transform .2s ease}
.btn.big:hover svg{transform:translateX(3px)}
.collage{position:relative;height:clamp(300px,min(42vw,58vh),560px);min-width:0;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.mini{position:absolute;inset:0 -40px 0 8%;display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:10px;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent)}
.lane{min-width:0;overflow:hidden}
.track{display:flex;flex-direction:column;gap:10px;animation:up var(--dur,30s) linear infinite;animation-delay:var(--off,0s)}
.lane:hover .track{animation-play-state:paused}
@keyframes up{from{transform:translateY(0)}to{transform:translateY(calc(-50% - 5px))}}
.card{all:unset;cursor:pointer;display:flex;height:clamp(64px,10vh,96px);flex:none;border-radius:14px;overflow:hidden;min-width:0;transition:transform .25s ease,box-shadow .25s ease}
.card i{flex:1}
.card:hover,.card:focus-visible{transform:scale(1.03);box-shadow:0 12px 24px -12px rgba(0,0,0,.6)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@keyframes drop{from{transform:translateY(-10px)}to{transform:none}}
.feature{position:absolute;left:0;bottom:0;width:min(78%,640px);height:58%;border-radius:22px;overflow:hidden;display:flex;box-shadow:0 30px 60px -20px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);z-index:2}
.feature i{flex:1;position:relative;transition:background .6s ease,color .6s ease;transition-delay:calc(var(--k,0) * 60ms)}
.feature i span{position:absolute;left:12px;bottom:12px;font-size:12px;font-weight:600;letter-spacing:.02em;opacity:.85}
@media (max-width:900px){.collage{margin-right:0}.mini{inset:0 -30% 0 0}}
@media (max-width:520px){.mini{grid-template-columns:repeat(3,minmax(120px,1fr))}.feature{width:92%}.feature i span{display:none}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.fact{padding:clamp(10px,2vh,18px) 20px 0 0;display:flex;flex-direction:column;gap:4px}
.fact b{font-family:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;font-weight:400;font-size:clamp(30px,min(3.6vw,5.5vh),48px);letter-spacing:0;line-height:1;font-variant-numeric:tabular-nums}
.fact span{color:var(--ink-3);font-size:15px}
@media (max-width:700px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.main.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.15) both}
.main.pop .col{animation:colIn .5s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(.08s + var(--ci,0) * 50ms)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes colIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.back{all:unset;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:6px;padding:4px 2px}
.back:hover{color:var(--ink)}
.back:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){.track,.main.pop,.main.pop .col{animation:none}.headline .ch{transition:none}}
</style>
</head>
<body>


<div class="app">
  <div class="top">
    <div class="theme" role="group" aria-label="Theme">
      <button id="tLight" aria-label="Light theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>

const D={"fam": {"base": [["black", "#000000"], ["white", "#FFFFFF"]], "cool-neutral": [["25", "#F7F7F7"], ["50", "#F2F2F2"], ["100", "#DBDBDB"], ["200", "#C4C4C4"], ["300", "#ADADAD"], ["400", "#969696"], ["500", "#808080"], ["600", "#525252"], ["700", "#3B3B3B"], ["800", "#242424"], ["900", "#0D0D0D"]], "sunshine-yellow": [["25", "#FFFBEB"], ["50", "#FEE685"], ["100", "#FD9A00"], ["200", "#BB4D00"], ["300", "#722902"]], "sunrise-glow": [["25", "#FFEEE3"], ["50", "#FA8E63"], ["100", "#D54101"], ["200", "#6F2305"], ["300", "#2B0E03"]], "comfort-pink": [["25", "#FDECF4"], ["50", "#F9CFE3"], ["100", "#E79ABD"], ["200", "#B1527F"], ["300", "#772A4D"]], "healing-mauve": [["25", "#FAE5FD"], ["50", "#F1BAFA"], ["100", "#D786E4"], ["200", "#864291"], ["300", "#6E2A79"]], "wellness-green": [["25", "#E0F6E9"], ["50", "#43A46D"], ["100", "#156437"], ["200", "#013E1C"], ["300", "#002C13"]], "precision-blue": [["25", "#ECF8FF"], ["50", "#6BBDFF"], ["100", "#1772BB"], ["200", "#003E6F"], ["300", "#00233F"]], "horizon-blue": [["25", "#EEFEFF"], ["50", "#BEF9FF"], ["100", "#1AC7D8"], ["200", "#086E78"], ["300", "#002C30"]], "vital-red": [["25", "#FFE0E3"], ["50", "#FF9EA7"], ["100", "#C50F1F"], ["200", "#87151F"], ["300", "#4A050B"]], "golden": [["25", "#FFEECC"], ["50", "#F3D7AC"], ["100", "#EBC288"], ["200", "#B17E37"], ["300", "#9E5E05"]], "brown": [["25", "#D7CBC7"], ["50", "#AF9F9F"], ["100", "#8D7676"], ["200", "#543232"], ["300", "#290808"]], "jovial-purple": [["25", "#F2EFFF"], ["50", "#CEC4FF"], ["100", "#B4A4FF"], ["200", "#6350BA"], ["300", "#4C318C"]], "flame-coral": [["25", "#FEF7F5"], ["50", "#FFB5A3"], ["100", "#FF5443"], ["200", "#C83B30"], ["300", "#830F0F"]]}, "sem": [["bg/success/base", "color/wellness-green/200", "#013E1C"], ["bg/success/subtle", "color/wellness-green/50", "#43A46D"], ["bg/success/subtler", "color/wellness-green/25", "#E0F6E9"], ["bg/error/subtler", "color/vital-red/25", "#FFE0E3"], ["bg/error/subtle", "color/vital-red/50", "#FF9EA7"], ["bg/error/base", "color/vital-red/200", "#87151F"], ["bg/warning/subtler", "color/sunrise-glow/25", "#FFEEE3"], ["bg/warning/subtle", "color/sunrise-glow/50", "#FA8E63"], ["bg/warning/base", "color/sunrise-glow/100", "#D54101"], ["bg/info/subtler", "color/precision-blue/25", "#ECF8FF"], ["bg/info/subtle", "color/precision-blue/50", "#6BBDFF"], ["bg/info/base", "color/precision-blue/200", "#003E6F"], ["text/brand/primary-inverse", "color/base/white", "#FFFFFF"], ["text/brand/tertiary", "color/cool-neutral/600", "#525252"], ["text/brand/secondary", "color/cool-neutral/700", "#3B3B3B"], ["text/brand/primary", "color/cool-neutral/900", "#0D0D0D"], ["text/success/subtle", "color/wellness-green/50", "#43A46D"], ["text/success/base", "color/wellness-green/100", "#156437"], ["text/success/bold", "color/wellness-green/300", "#002C13"], ["text/error/subtle", "color/vital-red/50", "#FF9EA7"], ["text/error/base", "color/vital-red/100", "#C50F1F"], ["text/error/bold", "color/vital-red/300", "#4A050B"], ["text/info/subtle", "color/precision-blue/50", "#6BBDFF"], ["text/info/base", "color/precision-blue/100", "#1772BB"], ["text/info/bold", "color/precision-blue/300", "#00233F"], ["icon/brand/tertiary", "color/cool-neutral/600", "#525252"], ["icon/brand/secondary", "color/cool-neutral/700", "#3B3B3B"], ["icon/brand/primary", "color/cool-neutral/900", "#0D0D0D"], ["icon/success/subtle", "color/wellness-green/50", "#43A46D"], ["icon/success/base", "color/wellness-green/200", "#013E1C"], ["icon/success/bold", "color/wellness-green/300", "#002C13"], ["icon/error/subtle", "color/vital-red/50", "#FF9EA7"], ["icon/error/base", "color/vital-red/100", "#C50F1F"], ["icon/error/bold", "color/vital-red/300", "#4A050B"], ["icon/warning/subtle", "color/sunrise-glow/50", "#FA8E63"], ["icon/warning/base", "color/sunrise-glow/100", "#D54101"], ["icon/warning/bold", "color/sunrise-glow/300", "#2B0E03"], ["border/neutrals/tertiary", "color/cool-neutral/200", "#C4C4C4"], ["border/neutrals/primary", "color/cool-neutral/50", "#F2F2F2"], ["border/success/subtle", "color/wellness-green/50", "#43A46D"], ["border/success/moderate", "color/wellness-green/100", "#156437"], ["border/success/intense", "color/wellness-green/200", "#013E1C"], ["border/error/subtle", "color/vital-red/50", "#FF9EA7"], ["border/error/moderate", "color/vital-red/100", "#C50F1F"], ["border/error/intense", "color/vital-red/200", "#87151F"], ["border/warning/subtle", "color/sunrise-glow/50", "#FA8E63"], ["border/warning/moderate", "color/sunrise-glow/100", "#D54101"], ["border/warning/intense", "color/sunrise-glow/200", "#6F2305"], ["border/info/subtle", "color/precision-blue/50", "#6BBDFF"], ["border/info/moderate", "color/precision-blue/100", "#1772BB"], ["border/info/intense", "color/precision-blue/200", "#003E6F"], ["icon/info/subtle", "color/precision-blue/50", "#6BBDFF"], ["icon/info/base", "color/precision-blue/100", "#1772BB"], ["icon/info/bold", "color/precision-blue/300", "#00233F"], ["icon/brand/coral", "color/flame-coral/100", "#FF5443"], ["bg/brand/primary", "color/base/white", "#FFFFFF"], ["border/neutrals/secondary", "color/cool-neutral/100", "#DBDBDB"], ["text/brand/brand", "color/flame-coral/100", "#FF5443"], ["bg/brand/secondary", "color/cool-neutral/25", "#F7F7F7"], ["bg/brand/quartenary", "color/cool-neutral/100", "#DBDBDB"], ["bg/brand/coral", "color/flame-coral/100", "#FF5443"], ["bg/brand/primary-inverse", "color/cool-neutral/900", "#0D0D0D"], ["text/brand/quartenary", "color/cool-neutral/500", "#808080"], ["text/brand/disabled", "color/cool-neutral/500", "#808080"], ["icon/brand/primary-inverse", "color/base/white", "#FFFFFF"], ["icon/brand/quartenary", "color/cool-neutral/500", "#808080"], ["icon/brand/disabled", "color/cool-neutral/500", "#808080"], ["border/neutrals/disabled", "color/cool-neutral/300", "#ADADAD"], ["bg/brand/quinary", "color/cool-neutral/200", "#C4C4C4"], ["bg/brand/disabled", "color/cool-neutral/100", "#DBDBDB"], ["text/warning/subtle", "color/sunrise-glow/50", "#FA8E63"], ["text/warning/base", "color/sunrise-glow/100", "#D54101"], ["text/warning/bold", "color/sunrise-glow/200", "#6F2305"], ["bg/brand/tertiary", "color/cool-neutral/50", "#F2F2F2"], ["border/neutrals/quartenary", "color/cool-neutral/400", "#969696"]], "ut": [["HIH/need-attention", "color/vital-red/100", "#C50F1F"], ["HIH/need-monitoring", "color/sunrise-glow/100", "#D54101"], ["HIH/need-immediate-attention", "color/vital-red/200", "#87151F"], ["HIH/borderline-abnormal", "color/sunshine-yellow/100", "#FD9A00"], ["HIH/normal", "color/wellness-green/100", "#156437"], ["category/corporate", "color/horizon-blue/100", "#1AC7D8"], ["category/quick-commerce", "color/healing-mauve/100", "#D786E4"]]};
const $=id=>document.getElementById(id);
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const lin=v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4;
const lum=h=>{const c=hexRgb(h).map(v=>lin(v/255));return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const onCol=h=>cr(h,"#FFFFFF")>=cr(h,"#0D0D0D")?"#FFFFFF":"#0D0D0D";
function hsl(h){let [r,g,b]=hexRgb(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let H=0,S=0;
  if(mx!==mn){const d=mx-mn;S=l>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H*=60}
  return [Math.round(H),Math.round(S*100),Math.round(l*100)]}
function cmyk(h){const [r,g,b]=hexRgb(h).map(v=>v/255),k=1-Math.max(r,g,b);if(k===1)return[0,0,0,100];
  return [(1-r-k)/(1-k),(1-g-k)/(1-k),(1-b-k)/(1-k),k].map(v=>Math.round(v*100))}
function labFromLin([r,g,b]){
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  return [.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s]}
const lab=h=>labFromLin(hexRgb(h).map(v=>lin(v/255)));
const chroma=h=>{const [,a,b]=lab(h);return Math.hypot(a,b)};
/* colour-vision simulation (Machado 2009, full severity) */
const CVD=[[[.152286,1.052583,-.204868],[.114503,.786281,.099216],[-.003882,-.048116,1.051998]],
 [[.367322,.860646,-.227968],[.280085,.672501,.047413],[-.01182,.04294,.968881]],
 [[1.255528,-.076749,-.178779],[-.078411,.930809,.147602],[.004733,.691367,.3039]]];
const sim=(h,M)=>{const c=hexRgb(h).map(v=>lin(v/255));return labFromLin(M.map(r=>Math.min(1,Math.max(0,r[0]*c[0]+r[1]*c[1]+r[2]*c[2]))))};
const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]);
const T=s=>s.replace(/[-/]/g," ").replace(/\b\w/g,c=>c.toUpperCase());

/* ---------- primitives ---------- */
const PRIM={
 "flame-coral":["Energetic","the brand accent, primary actions and anything that should feel like 1mg"],
 "cool-neutral":["Quiet","text, surfaces, borders and disabled states"],
 "vital-red":["Urgent","errors, destructive actions and abnormal results"],
 "sunrise-glow":["Alert","warnings and values that need monitoring"],
 "sunshine-yellow":["Cautious","borderline results and soft highlights"],
 "wellness-green":["Reassuring","success states and normal results"],
 "precision-blue":["Clinical","information states and links"],
 "horizon-blue":["Fresh","the corporate category accent"],
 "healing-mauve":["Calm","the quick-commerce category accent"],
 "comfort-pink":["Gentle","care moments and gentle highlights"],
 "jovial-purple":["Playful","illustration, celebration and lighter moments"],
 "golden":["Premium","memberships, rewards and offers"],
 "brown":["Earthy","Ayurveda and natural products"]
};
const pals=[];
Object.entries(PRIM).forEach(([k,[ch,use]])=>{
  const f=D.fam[k];if(!f)return;
  pals.push({id:k,name:T(k),kind:"Primitive",group:"Primitives",character:ch,from:"Primitives collection",
    best:`Best for ${use}.`,
    sw:f.map(([st,h])=>({big:st,sub:`${T(k)} ${st}`,tok:`color/${k}/${st}`,hex:h}))});
});

/* ---------- semantic: grouped exactly as in the Semantic collection ---------- */
const ROLE={bg:"Background",text:"Text",icon:"Icon",border:"Border"};
const INTENT={brand:"Brand",neutrals:"Neutral",success:"Success",error:"Error",warning:"Warning",info:"Info"};
const ORD=["primary","secondary","tertiary","quartenary","quinary","disabled","primary-inverse","brand","coral","subtler","subtle","base","moderate","intense","bold"];
const CHAR={brand:"Foundational",neutrals:"Structural",success:"Reassuring",error:"Urgent",warning:"Alert",info:"Informative"};
const USE={
 bg:i=>i==="brand"?"page surfaces, cards, fills and inverse panels":`${INTENT[i].toLowerCase()} banners, badges and fills`,
 text:i=>i==="brand"?"headings, body copy, captions and links":`${INTENT[i].toLowerCase()} messages and inline labels`,
 icon:i=>i==="brand"?"interface icons at every emphasis level":`${INTENT[i].toLowerCase()} icons and status glyphs`,
 border:i=>i==="neutrals"?"dividers, card outlines, inputs and disabled edges":`${INTENT[i].toLowerCase()} outlines, input states and focus edges`
};
const groups={};
D.sem.forEach(([tok,alias,hex])=>{const [r,i,l]=tok.split("/");(groups[r+"/"+i]=groups[r+"/"+i]||{r,i,items:[]}).items.push({l,tok,alias,hex})});
["bg","text","icon","border"].forEach(r=>["brand","neutrals","success","warning","error","info"].forEach(i=>{
  const g=groups[r+"/"+i];if(!g)return;
  g.items.sort((a,b)=>ORD.indexOf(a.l)-ORD.indexOf(b.l));
  pals.push({id:r+"-"+i,name:`${INTENT[i]} ${ROLE[r]}`,kind:"Semantic",group:ROLE[r],path:`${r}/${i}`,character:CHAR[i],from:`Semantic · ${r}/${i}`,
    best:`Best for ${USE[r](i)}.`,
    sw:g.items.map(x=>({big:T(x.l),sub:x.tok,tok:x.tok,hex:x.hex,alias:x.alias}))});
}));
/* utility */
const HO=["normal","borderline-abnormal","need-monitoring","need-attention","need-immediate-attention"];
const hih=D.ut.filter(x=>x[0].startsWith("HIH/")).sort((a,b)=>HO.indexOf(a[0].slice(4))-HO.indexOf(b[0].slice(4)));
pals.push({id:"hih",name:"Health Status",kind:"Utility",group:"Utility",path:"HIH",character:"Diagnostic",from:"Utility · HIH",
  best:"Best for lab results and vitals, read in order from normal to needs immediate attention.",
  sw:hih.map(x=>({big:T(x[0].slice(4)),sub:x[0],tok:x[0],hex:x[2],alias:x[1]}))});
const cat=D.ut.filter(x=>x[0].startsWith("category/"));
pals.push({id:"category",name:"Business Categories",kind:"Utility",group:"Utility",path:"category",character:"Wayfinding",from:"Utility · category",
  best:"Best for tagging which business line a card or order belongs to.",
  sw:cat.map(x=>({big:T(x[0].slice(9)),sub:x[0],tok:x[0],hex:x[2],alias:x[1]}))});

pals.forEach(p=>{
  const u=[...new Set(p.sw.map(s=>s.hex))];let best=1,pairs=0,tot=0,cvd=0;
  for(let i=0;i<u.length;i++)for(let j=i+1;j<u.length;j++){
    const c=cr(u[i],u[j]);tot++;best=Math.max(best,c);if(c>=4.5)pairs++;
    if(CVD.every(M=>dist(sim(u[i],M),sim(u[j],M))>=.05))cvd++;
  }
  const ls=p.sw.map(s=>hsl(s.hex)[2]);
  const vivid=p.sw.reduce((a,s)=>chroma(s.hex)>chroma(a.hex)?s:a);
  const hue=hsl(vivid.hex)[0],C=chroma(vivid.hex);
  const temp=C<.02?"Neutral":(hue<75||hue>=300)?"Warm":"Cool";
  const mean=ls.reduce((a,b)=>a+b,0)/ls.length;
  Object.assign(p,{best_c:best,pairs,tot,cvd,hue,C,temp,lmin:Math.min(...ls),lmax:Math.max(...ls),
    tone:mean<38?"Dark":mean>68?"Light":"Balanced",uniq:u});
});

/* ---------- UI ---------- */
let cur=pals[0].id, filter=1, sorted=false;
const oklchStr=h=>{const [L,a,b]=lab(h),C=Math.hypot(a,b);let H=Math.atan2(b,a)*180/Math.PI;if(H<0)H+=360;
  return `${(L*100).toFixed(1)}% ${C.toFixed(3)} ${C<.002?0:Math.round(H)}`};
const BASE_TEXT=Object.fromEntries(D.sem.filter(x=>/^text\/[a-z]+\/base$/.test(x[0])).map(x=>[x[0].split("/")[1],x[2]]));
const syncTabs=()=>document.querySelectorAll(".seg").forEach(x=>x.setAttribute("aria-selected",+x.dataset.f===filter));
const FIL=[["All palettes",()=>true],["Primitives",p=>p.kind==="Primitive"],["Semantic",p=>p.kind!=="Primitive"]];
function renderList(){
  const q=$("q").value.trim().toLowerCase();
  let ps=pals.filter(FIL[filter][1]).filter(p=>!q||(p.name+" "+(p.path||"")+" "+p.sw.map(s=>s.hex+" "+s.tok+" "+(s.alias||"")).join(" ")).toLowerCase().includes(q));
  if(sorted)ps=[...ps].sort((a,b)=>b.best_c-a.best_c);
  let html="",last="";
  ps.forEach(p=>{
    if(!sorted&&p.group!==last){html+=`<div class="sec">${p.group}${p.kind==="Semantic"?" tokens":""}</div>`;last=p.group}
    const top=p.sw.reduce((a,s)=>lum(s.hex)>lum(a.hex)?s:a);
    html+=`<button class="item" data-id="${p.id}" aria-current="${p.id===cur}">
      <div class="row1"><div class="bar">${p.sw.map(s=>`<i style="background:${s.hex}"></i>`).join("")}</div>
      <span class="mx" style="background:${top.hex};color:${onCol(top.hex)}">${p.best_c.toFixed(1)}</span></div>
      <div class="row2"><span class="n"><strong>${p.name}</strong><span class="chipx">${p.path||p.kind}</span></span>
      ${p.pairs?'<span class="aa ok">✓ AA</span>':'<span class="aa no">× AA</span>'}</div></button>`});
  $("list").innerHTML=html||`<p style="padding:20px;color:var(--ink-3)">No palette matches “${q}”.</p>`;
  $("list").querySelectorAll(".item").forEach(b=>b.onclick=()=>show(b.dataset.id));
}
const copyIc='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
function show(id){
  cur=id;const p=pals.find(x=>x.id===id);
  try{localStorage.setItem("dop-pal",id)}catch(e){}
  filter=p.kind==="Primitive"?1:2;syncTabs();
  renderList();
  const many=p.sw.length>5;
  $("cols").className="cols"+(many?" many":"");
  $("cols").innerHTML=p.sw.map(s=>{const [r,g,b]=hexRgb(s.hex),[H,S2,L]=hsl(s.hex),c=cmyk(s.hex);
    const parts=s.tok.split("/"),lvl=parts[parts.length-1],baseInk=s.alias&&/^subtle(r)?$/.test(lvl)&&BASE_TEXT[parts[1]];
    const ink=baseInk||onCol(s.hex),tone=onCol(s.hex);
    const div=tone==="#FFFFFF"?"rgba(255,255,255,.18)":"rgba(0,0,0,.12)",hov=tone==="#FFFFFF"?"rgba(255,255,255,.08)":"rgba(0,0,0,.05)";
    const kv=(k,v,cp=v)=>`<button class="kv" data-v="${cp}" title="Copy ${k}"><span><small>${k}</small>${v}</span>${copyIc}</button>`;
    const rows=s.alias
      ? kv("TOKEN",s.tok)+kv("MAPS TO",s.alias.replace("color/",""),s.alias)+kv("HEX",s.hex)+kv("RGB",`${r} ${g} ${b}`)+kv("HSL",`${H}° ${S2}% ${L}%`)+kv("OKLCH",oklchStr(s.hex),`oklch(${oklchStr(s.hex)})`)
      : kv("HEX",s.hex)+kv("RGB",`${r} ${g} ${b}`)+kv("CMYK",c.join(" "))+kv("HSL",`${H}° ${S2}% ${L}%`)+kv("OKLCH",oklchStr(s.hex),`oklch(${oklchStr(s.hex)})`)+kv("TOKEN",s.tok);
    return `<div class="col" style="background:${s.hex};color:${ink};--div:${div};--hov:${hov}">
      <div class="hd"><span class="pc">${s.big}</span><span class="nm">${s.alias?"":s.sub}</span></div>${rows}</div>`}).join("");
  $("cols").querySelectorAll(".kv").forEach(b=>b.onclick=()=>copy(b.dataset.v));
  $("title").textContent=p.name;
  $("tags").innerHTML=[p.temp,p.tone].map(t=>`<span>${t}</span>`).join("");
  const adv=p.tot===0?"There is only one distinct colour here, so pair it with your surface colours."
    :p.pairs===p.tot?`All ${p.tot} pairs meet AA for normal text, so any combination works for body copy.`
    :p.pairs?`${p.pairs} of ${p.tot} pairs meet AA for normal text, so keep body text to those pairs. Check the pair you intend to use in the contrast checker.`
    :`No pair meets AA for normal text, so treat it as imagery. Check the pair you intend to use in the contrast checker.`;
  $("desc").textContent=`${p.best} ${adv}`;
  const byL=[...p.uniq].sort((a,b)=>lum(b)-lum(a)),pick=i=>byL[Math.min(byL.length-1,Math.round(i*(byL.length-1)))];
  $("orb").style.background=`radial-gradient(60% 80% at 78% 30%,${pick(0)} 0%,transparent 70%),radial-gradient(70% 90% at 30% 70%,${pick(.5)} 0%,transparent 75%),radial-gradient(50% 60% at 20% 20%,${pick(1)} 0%,transparent 80%),linear-gradient(120deg,${pick(1)},${pick(.25)})`;
  const row=(k,v)=>`<div class="r"><dt>${k}</dt><dd>${v}</dd></div>`;
  $("stats").innerHTML=`
   <div><h3>Colour</h3><dl>${row("Dominant Hue",p.C<.02?"—":p.hue+"°")}${row("Chroma",p.C.toFixed(3))}${row("Lightness",p.lmin+"–"+p.lmax+"%")}${row("Temperature",p.temp)}</dl></div>
   <div><h3>Accessibility</h3><dl>${row("Max Contrast",p.best_c.toFixed(1)+":1")}<div class="r"><dt>AA Text Pairs</dt><dd class="pp"><button class="pill" id="ccPill" aria-pressed="${!$("matrix").hidden}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></svg>AA</button>${p.pairs}/${p.tot}</dd></div>${row("Colour Blind Safe",p.cvd+"/"+p.tot)}</dl></div>
   <div><h3>Reading</h3><dl>${row("Character",p.character)}${row("Name From",p.from)}</dl></div>`;
  $("ccPill").onclick=toggleMatrix;
  renderMatrix(p);
}
function renderMatrix(p){
  const sw=p.sw.filter((s,i)=>p.sw.findIndex(t=>t.hex===s.hex)===i);
  $("matrix").innerHTML=`<table><tr><th></th>${sw.map(s=>`<th>${s.big}</th>`).join("")}</tr>${sw.map(a=>`<tr><th>${a.big}</th>${sw.map(b=>{
    if(a===b)return `<td style="background:var(--panel-2);color:var(--ink-3)">—</td>`;
    const c=cr(a.hex,b.hex),g=c>=7?"AAA":c>=4.5?"AA":c>=3?"AA Large":"Fail";
    return `<td style="background:${a.hex};color:${b.hex}">${c.toFixed(2)}<small>${g}</small></td>`}).join("")}</tr>`).join("")}</table>`;
}
function toggleMatrix(){const on=$("matrix").hidden;$("matrix").hidden=!on;$("cc").setAttribute("aria-pressed",on);const pl=$("ccPill");if(pl)pl.setAttribute("aria-pressed",on);if(on)$("matrix").scrollIntoView({block:"nearest",behavior:"smooth"})}
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),1500)}
function fallback(v,msg){const t=document.createElement("textarea");t.value=v;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}t.remove();toast(ok?msg:"Copy blocked here")}
function copy(v,msg){msg=msg||"Copied "+v;try{navigator.clipboard.writeText(v).then(()=>toast(msg),()=>fallback(v,msg))}catch(e){fallback(v,msg)}}
const cssName=t=>"--"+t.replace(/^color\//,"").replace(/\//g,"-").toLowerCase();
const cssVal=s=>s.alias?`var(${cssName(s.alias)}) /* ${s.hex} */`:s.hex;
$("css").onclick=()=>{const p=pals.find(x=>x.id===cur);copy(`:root {\n${p.sw.map(s=>`  ${cssName(s.tok)}: ${cssVal(s)};`).join("\n")}\n}`,"Copied CSS for "+p.name)};
$("json").onclick=()=>{const p=pals.find(x=>x.id===cur);copy(JSON.stringify(Object.fromEntries(p.sw.map(s=>[s.tok,s.alias?{value:s.hex,alias:s.alias}:s.hex])),null,2),"Copied JSON for "+p.name)};
$("cc").onclick=toggleMatrix;
$("copyAll").onclick=()=>{const lines=[];Object.entries(D.fam).forEach(([f,s])=>s.forEach(([k,h])=>lines.push(`  --${f}-${k}: ${h};`)));
  [...D.sem,...D.ut].forEach(x=>lines.push(`  ${cssName(x[0])}: var(${cssName(x[1])}); /* ${x[2]} */`));
  copy(`:root {\n${lines.join("\n")}\n}`,`Copied ${lines.length} tokens as CSS`)};
$("q").oninput=renderList;
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("q").focus()}});
document.querySelectorAll(".seg").forEach(b=>b.onclick=()=>{filter=+b.dataset.f;syncTabs();renderList()});
$("sortBtn").onclick=()=>{sorted=!sorted;toast(sorted?"Sorted by contrast":"Grouped by collection");renderList()};
function setTheme(t){document.documentElement.dataset.theme=t;$("tLight").setAttribute("aria-pressed",t==="light");$("tDark").setAttribute("aria-pressed",t==="dark");try{localStorage.setItem("dop-theme",t)}catch(e){}}
$("tLight").onclick=()=>setTheme("light");$("tDark").onclick=()=>setTheme("dark");
let th=null;try{th=localStorage.getItem("dop-theme")}catch(e){}
setTheme("dark");
let st=pals[0].id;try{const s=localStorage.getItem("dop-pal");if(s&&pals.some(p=>p.id===s))st=s}catch(e){}
show(st);
/* ---------- landing ---------- */
const HOT=["#FF5443","#FD9A00","#43A46D","#6BBDFF","#1AC7D8","#B4A4FF","#D786E4","#E79ABD","#EBC288","#FA8E63","#FEE685","#BEF9FF"];
(function(){
  const h=$("landTitle"),words=h.dataset.text.split(" ");let n=0;
  h.setAttribute("aria-label",h.dataset.text);
  h.innerHTML=words.map(w=>`<span class="w" aria-hidden="true">${[...w].map(c=>`<span class="ch">${c}</span>`).join("")}</span>`).join(" ");
  const chs=[...h.querySelectorAll(".ch")];
  chs[chs.length-1-6].style.color="#FF5443"; /* a quiet brand note at rest, on the 'g' of 1mg */
  const paint=el=>{el.style.color=HOT[n++%HOT.length];el.classList.add("hot");clearTimeout(el._t);
    el._t=setTimeout(()=>{el.classList.remove("hot");el.style.color=el===chs[chs.length-7]?"#FF5443":""},900)};
  chs.forEach(el=>el.addEventListener("mouseenter",()=>paint(el)));
  h.addEventListener("touchmove",e=>{const t=e.touches[0],el=document.elementFromPoint(t.clientX,t.clientY);if(el&&el.classList.contains("ch"))paint(el)},{passive:true});
})();
const LO=["flame-coral","precision-blue","sunshine-yellow","jovial-purple","wellness-green","comfort-pink","horizon-blue","sunrise-glow","healing-mauve","golden","vital-red","brown","cool-neutral"];
const five=k=>{const f=D.fam[k];return f.length>5?[f[0],f[2],f[5],f[8],f[10]]:f};
const cardH=(k,dup)=>`<button class="card" data-f="${k}" ${dup?'tabindex="-1" aria-hidden="true"':`aria-label="Open ${T(k)}"`}>${five(k).map(s=>`<i style="background:${s[1]}"></i>`).join("")}</button>`;
$("mini").innerHTML=[0,1,2].map(l=>{const ks=LO.map((_,i)=>LO[(i*1+l*4)%LO.length]).slice(0,7);
  return `<div class="lane"><div class="track" style="--dur:${[34,27,40][l]}s;--off:-${[0,9,17][l]}s">${ks.map(k=>cardH(k)).join("")}${ks.map(k=>cardH(k,1)).join("")}</div></div>`}).join("");
let fi=0,fk=null,paused=false;
$("feature").innerHTML=[0,1,2,3,4].map(k=>`<i style="--k:${k}"><span></span></i>`).join("");
function feature(k){
  if(k===fk)return;fk=k;const st=five(k);
  $("feature").querySelectorAll("i").forEach((el,i)=>{const h=st[i][1];el.style.background=h;el.style.color=onCol(h);el.firstChild.textContent=h});
  $("feature").dataset.f=k;
}
feature(LO[0]);
setInterval(()=>{if(paused||document.hidden)return;fi=(fi+1)%LO.length;feature(LO[fi])},2600);
$("mini").querySelectorAll(".card").forEach(c=>{
  c.addEventListener("mouseenter",()=>{paused=true;feature(c.dataset.f)});
  c.addEventListener("mouseleave",()=>{paused=false;fi=Math.max(0,LO.indexOf(c.dataset.f))});
  c.addEventListener("focus",()=>{paused=true;feature(c.dataset.f)});c.addEventListener("blur",()=>paused=false);
  c.onclick=()=>go("gallery",c.dataset.f)});
$("feature").onclick=()=>go("gallery",$("feature").dataset.f);$("feature").style.cursor="pointer";
const primN=Object.values(D.fam).reduce((a,f)=>a+f.length,0);
$("facts").innerHTML=[[13,"colour families"],[primN,"primitive tokens"],[D.sem.length,"semantic tokens"],[D.ut.length,"health & category tokens"]]
  .map(([n,l])=>`<div class="fact"><b>${n}</b><span>${l}</span></div>`).join("");

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function setView(v){document.documentElement.dataset.view=v}
function go(v,fam){
  if(v==="gallery"){
    if(fam)show(fam);
    const enter=()=>{setView("gallery");const m=document.querySelector(".main");
      document.querySelectorAll("#cols .col").forEach((c,i)=>c.style.setProperty("--ci",i));
      m.classList.remove("pop");void m.offsetWidth;m.classList.add("pop");window.scrollTo(0,0);
      $("landing").classList.remove("leaving");
      if(location.hash!=="#colours")history.pushState(null,"","#colours")};
    if(reduce)enter();else{$("landing").classList.add("leaving");setTimeout(enter,280)}
  }else{
    setView("landing");window.scrollTo(0,0);
    if(location.hash)history.pushState(null,"",location.pathname+location.search)}
}
$("explore").onclick=()=>go("gallery");
$("back").onclick=()=>go("landing");
(()=>{const w=document.querySelector(".top .word");w.setAttribute("role","link");w.tabIndex=0;w.setAttribute("aria-label","Dopamine spike, back to overview");w.style.cursor="pointer";
  const home=()=>{if(document.documentElement.dataset.view==="gallery")go("landing");else window.scrollTo({top:0,behavior:reduce?"auto":"smooth"})};
  w.onclick=home;w.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();home()}}})();
addEventListener("popstate",()=>setView(location.hash==="#colours"?"gallery":"landing"));
addEventListener("hashchange",()=>setView(location.hash==="#colours"?"gallery":"landing"));
setView(location.hash==="#colours"?"gallery":"landing");
</script>

</body>
</html>
